Sim. O que você guarda ou retira de uma meta ou cofrinho aparece na lista de Lançamentos (e na aba <b>Guardado</b>). Não conta como gasto nem como entrada: no Resumo, entra em “Guardado”.`],[`Preciso marcar as entradas como recebidas?`,`Não. Toda entrada nova já fica como <b>recebida</b>. As entradas fixas (como o salário) contam como recebidas sozinhas quando chega o dia delas.`],[`O que eu registro fica em qual mês?`,`No mês da data do lançamento — e fica <b>só nesse mês</b>. As únicas coisas que aparecem sozinhas nos meses seguintes são as <b>contas cadastradas</b> (fixas) e as <b>parcelas</b>.`],[`Para que serve a data de vencimento?`,`No lançamento, a <b>data da compra</b> decide em qual mês ele conta. A <b>data de vencimento</b> (opcional) não muda o mês: serve só para o <b>Calendário</b> mostrar a conta no dia certo e para o <b>aviso</b> chegar antes de vencer, mesmo que vença no mês seguinte.`],[`Qual a diferença entre gasto fixo e variável?`,`Variável é algo do mês (mercado, um lanche). Fixo é algo que costuma se repetir. Se quiser que ele apareça todo mês sozinho, ligue “Conta cadastrada (repetir todo mês)” ao lançar.`],[`Como marco uma conta como paga?`,`Toque na caixinha ao lado dela, em Lançamentos ou em “Contas a pagar” no Resumo. Para entradas, a caixinha significa “recebido”.`],[`Como procuro ou filtro?`,`Em Lançamentos: use as abas (Fixos, Variáveis, Parcelas, Entradas, Dívidas), a busca (procura também nas observações) e os filtros de categoria e forma de pagamento.`],[`Para que serve a observação?`,`Para lembretes e detalhes (“pagar até sexta”, “dividido com a Ana”). Ela aparece embaixo do lançamento e entra na busca.`],[`Posso exportar meus lançamentos?`,`Sim: em Lançamentos, “Exportar CSV” baixa o mês (com os filtros aplicados) para abrir no Excel ou Google Sheets.`]]},{title:`Contas fixas e parcelamentos`,icon:`repeat`,items:[[`O que é o saldo projetado?`,`Para contas (ou entradas) que mudam de valor todo mês, como luz, água, gás ou freela. Em Novo lançamento → <b>Saldo projetado</b>, coloque um <b>valor previsto</b>: ele aparece em todos os meses como <b>≈ Previsto</b>. Quando chegar o valor de verdade, toque em <b>Informar valor real</b>: ele vale só para aquele mês, e dá para usar esse valor como nova previsão dos próximos meses.`],[`Como faço o salário ou o aluguel entrarem todo mês?`,`Ao lançar, ligue <b>Conta cadastrada (repetir todo mês)</b>. Também dá pela tela Contas fixas → “Conta fixa” ou “Entrada fixa”.`],[`Mudei o valor de uma conta fixa só neste mês. Como faço?`,`Edite a conta e escolha <b>Só este mês</b>. Para mudar daqui para frente, escolha “Este e próximos meses” — os meses anteriores não mudam.`],[`Como paro uma conta fixa?`,`Exclua e escolha “Daqui em diante”, ou edite e preencha “Repete até”. Para pular só um mês, exclua escolhendo “Só este mês”.`],[`Como registro uma compra parcelada?`,`Novo lançamento → <b>Saída</b> → ligue <b>Compra parcelada</b>. Informe o valor (da parcela ou o total), o número de parcelas, a forma de pagamento e a <b>data da compra</b>. Cada parcela aparece sozinha no seu mês até a última; no cartão, cai uma parcela em cada fatura, respeitando o fechamento.`],[`Como registro um boleto parcelado (carnê)?`,`Novo lançamento → <b>Boleto parcelado</b> (é a Saída parcelada já com Boleto). Se ele já começou, coloque a data da 1ª parcela: as parcelas dos <b>meses que já passaram entram como pagas</b>, e só conta o que está <b>em aberto do mês atual em diante</b>. Cada parcela aparece em Contas a pagar e no Calendário para você marcar como paga.`]]},{title:`Cartões e faturas`,icon:`card`,items:[[`Como pago a fatura (uma parte ou tudo)?`,`Em Cartões, escolha o cartão: na fatura aparecem <b>Total, Pago e Falta</b>. Use <b>Pagar parte</b> para registrar um pagamento parcial ou <b>Quitar fatura</b> para pagar o que falta (as compras dela ficam marcadas como pagas). O que você paga volta para o limite do cartão. Errou? Toque no × do pagamento para desfazer.`],[`Como adianto uma parcela?`,`Numa compra parcelada, toque em <b>adiantar parcela</b> (na fatura, em Lançamentos ou em Parcelamentos). A próxima parcela em aberto passa a contar neste mês e, no cartão, cai na fatura atual. Para voltar atrás, use o botão de desfazer em Parcelamentos.`],[`Como informo o fechamento e o vencimento do cartão?`,`Ao criar ou editar o cartão, escolha as datas de uma fatura: o <b>dia e o mês do fechamento</b> e o <b>dia e o mês do vencimento</b> (ex.: fecha 26/06 e vence 07/07). O Flow repete essa regra todo mês.`],[`Em que fatura cai a minha compra?`,`Depende do <b>dia do fechamento</b> do cartão: compras até o dia anterior ao fechamento entram na fatura atual; no dia do fechamento ou depois, vão para a seguinte. Cada lançamento no cartão mostra a etiqueta “fatura dd/mm”.`],[`Onde informo o fechamento e o vencimento?`,`Em Cartões, toque no lápis do cartão. Ao digitar os dias, o Flow mostra um exemplo de em qual fatura cada compra cai.`],[`Como o limite livre do cartão é calculado?`,`Como num cartão de verdade: o limite menos a <b>fatura</b> e menos as <b>parcelas que ainda vão cair nas próximas faturas</b> (seus parcelamentos e as compras de quem usou o seu cartão). Uma compra de R$ 900 em 3x ocupa R$ 900 do limite desde o começo.`],[`Emprestei meu cartão para alguém. Como registro?`,`Em Devedores → Registrar → “Me devem”, escolha o cartão em <b>Usou o meu cartão?</b> (ou toque em “Alguém usou este cartão” na fatura). A compra entra na fatura e a pessoa fica te devendo — inclusive parcelado.`],[`O que é a barra de limite?`,`Quanto da fatura aberta (a que vence no mês seguinte) já usou do limite do cartão. Acima de 80% ela fica vermelha.`]]},{title:`Devedores e “Eu devo”`,icon:`users`,items:[[`A pessoa quer pagar (ou eu quero pagar) uma parcela antes?`,`Na cobrança parcelada, toque em <b>Adiantar parcela</b>: a próxima parcela em aberto fica paga agora e o dinheiro entra (ou sai) neste mês. Se a compra foi no seu cartão, a fatura não muda: só o pagamento da pessoa vem para este mês.`],[`As parcelas antigas precisam ser marcadas?`,`Não. Nas cobranças parceladas, as parcelas de <b>meses que já passaram são fechadas sozinhas</b>; a do mês atual e as próximas ficam abertas. Se reabrir uma parcela antiga, ela continua aberta.`],[`Marquei que a pessoa pagou. O que muda?`,`Se ela usou o seu cartão, a compra aparece como <b>paga</b> em Lançamentos (“Ana já te pagou”), mas a <b>fatura do cartão continua com o mesmo valor</b>, porque você ainda paga o cartão.`],[`Como coloco mais de uma cobrança para a mesma pessoa?`,`Em Devedores, cada pessoa tem um cartão com todas as cobranças dela e o total que falta. No fim do cartão, toque em <b>“+ Nova cobrança para…”</b> (ou “Nova dívida com…”, em Eu devo): o nome já vem preenchido. Ao registrar pelo botão Registrar, o Flow sugere os nomes que você já usou.`],[`Como registro quem me deve ou o que eu devo?`,`Em Devedores → Registrar. Escolha “Me devem” ou “Eu devo”, a pessoa, o valor e, se for o caso, o número de parcelas.`],[`O que eu devo entra nos gastos do mês?`,`Sim: cada parcela do que você deve entra no <b>total de saídas do seu mês</b>. O que te pagam entra como entrada.`],[`Como marco uma parcela paga ou recebida?`,`No cartão da pessoa: “Pagar 03/10” (ou “Receber”) marca a parcela do mês; “Quitar tudo” marca todas. Dívidas à vista aceitam pagamento de uma parte.`]]},{title:`Calendário e lembretes`,icon:`calendar`,items:[[`O que aparece no Calendário?`,`Em cada dia: <b>vencimento</b> e <b>fechamento</b> das faturas, contas a pagar, entradas, cobranças de quem te deve e os seus lembretes. As compras no cartão aparecem dentro da fatura. Toque num dia para ver a lista.`],[`Como crio um lembrete?`,`No Calendário, toque em <b>Novo lembrete</b> (ou em “Lembrete” no dia escolhido). Escolha Boleto, Conta ou Lembrete, a data, o valor (opcional) e se repete todo mês.`],[`O lembrete entra nos meus gastos?`,`Não: ele é só um aviso. Para contar como gasto, registre um lançamento normalmente.`],[`Como marco que já paguei?`,`Toque na caixinha ao lado do item no dia. Contas e cobranças são marcadas como pagas/recebidas também em Lançamentos e Devedores.`],[`O que significam as cores?`,`Rosa: vencimento de fatura · roxo: fechamento · laranja: conta a pagar · verde: entrada · azul: devedores · amarelo: lembrete. Dia com borda vermelha tem conta atrasada.`]]},{title:`Planejamento e metas`,icon:`target`,items:[[`Como funcionam os orçamentos?`,`Em <b>Orçamentos</b>, defina quanto quer gastar por mês em cada categoria. O Flow soma sozinho os lançamentos (avulsos, fixos, parcelas e cartão), mostra quanto falta, fica amarelo perto do limite e vermelho quando estoura, e avisa no sino. Ao registrar um gasto, o formulário já mostra como fica o orçamento.`],[`O que é um cofrinho?`,`Em Metas → <b>Novo cofrinho</b>. É uma caixinha <b>sem limite</b> de valor. Dá para colocar o <b>rendimento</b> (ex.: 1% ao mês, 0,05% ao dia, 13% ao ano) e o Flow calcula quanto já rendeu (cada depósito rende a partir da sua data) e quanto vai render em 1 mês, 6 meses e 1 ano, além da taxa equivalente por dia, mês e ano.`],[`O que é “Priorizar meta”?`,`Toque em <b>☆ Priorizar meta</b> na meta mais importante (só uma fica priorizada). Todo cofrinho <b>sem destino</b> manda para ela o que você guarda e o que rende. Um cofrinho também pode ter um destino próprio: escolha em “Para onde vai o dinheiro”.`],[`O que é “Quando o salário cair”?`,`Soma as <b>faturas que vencem no mês seguinte</b> e as <b>contas desse mês fora do cartão</b>, e compara com as entradas previstas. O resultado é quanto sobra depois de pagar tudo — e quanto do salário já está comprometido.`],[`Por que as entradas previstas estão zeradas?`,`Cadastre seu salário como <b>entrada fixa</b> (Contas fixas → Entrada fixa) para ele aparecer em todos os meses.`],[`Como funcionam as metas?`,`Crie uma meta com o valor que quer juntar. “Guardar” tira o valor da sobra do mês e soma na meta; “Retirar” registra um gasto feito com o dinheiro guardado.`],[`Para que serve o orçamento da categoria?`,`Em Ajustes → Categorias, defina um limite por mês. No gráfico de categorias aparece um marcador e a barra fica vermelha quando passar.`]]},{title:`Sincronização, backup e importação`,icon:`refresh`,items:[[`O que é o backup contínuo?`,`Em Ajustes → Dados e armazenamento → <b>Backup contínuo</b>, conecte este aparelho a <b>um ou mais</b> aparelhos lendo um QR code uma vez. Depois disso, cada alteração vai para os outros em segundos, enquanto o app estiver aberto, e todos ficam com a mesma cópia: se um aparelho quebrar, os outros continuam com tudo.`],[`Como deixo o celular e o computador iguais?`,`Em Ajustes → Dados e armazenamento → Backup contínuo: num aparelho toque em <b>Mostrar QR para conectar</b>, no outro em <b>Ler QR</b>. Só precisa fazer uma vez; depois o Flow sincroniza sozinho ao abrir e logo depois de cada alteração.`],[`Meus dados ficam expostos na sincronização?`,`Não: eles viajam <b>cifrados (AES-256)</b> com uma chave que só existe nos aparelhos pareados. O serviço que entrega (ntfy.sh) não consegue ler e apaga as mensagens em até 12 h.`],[`Como faço backup?`,`Ajustes → Dados e armazenamento → <b>Exportar backup</b>. O arquivo leva todos os perfis. Para voltar, use “Restaurar backup”. O Flow lembra você se ficar mais de 30 dias sem backup.`],[`Como importo minha planilha?`,`Novo lançamento → Importar planilha. Selecione uma tabela no Google Sheets (com o cabeçalho), copie e cole — ou envie o .xlsx/.csv. Tudo é lido no seu aparelho, sem enviar nada.`],[`O que “Apagar tudo” apaga?`,`Todos os dados do Flow <b>neste aparelho</b>: lançamentos de todos os perfis, preferências, PIN, avisos e pareamentos. Não apaga o outro aparelho pareado, nem nada que não seja do Flow. Não dá para desfazer — faça um backup antes.`]]},{title:`App Android, avisos e segurança`,icon:`bell`,items:[[`Como sei se as notificações estão chegando?`,`Em Ajustes → Notificações, toque em <b>Testar notificação</b>. No Android ela chega em 5 segundos, mesmo com o app fechado. Se não chegar, libere as notificações do Flow nas configurações do celular.`],[`Como apago os avisos?`,`No sino: toque no <b>×</b> de um aviso, arraste ele para o lado ou use <b>Excluir todas</b>.`],[`Quando recebo os avisos?`,`No app Android: às 9h, com a antecedência escolhida (1 a 7 dias) e no dia do vencimento — mesmo com o app fechado. No navegador, os avisos ficam no sino 🔔.`],[`As notificações não chegam. O que faço?`,`Confira Ajustes → Notificações (ligadas e com permissão). No celular: Configurações → Apps → Flow → Notificações → permitir. Alguns aparelhos economizam bateria fechando apps: desative a economia para o Flow.`],[`Como coloco o widget na tela inicial?`,`Segure o dedo num espaço vazio da tela inicial → Widgets → <b>Flow</b>. Ele mostra a sobra do mês, a próxima conta e quanto sobra quando o salário cair. Com PIN ligado, os valores ficam escondidos.`],[`Esqueci o PIN. E agora?`,`Na tela de bloqueio toque em <b>Esqueci</b> e digite o código de recuperação que apareceu quando você ligou o bloqueio.`],[`Para que servem os perfis financeiros?`,`Para separar finanças (pessoal, casa, trabalho). Cada perfil tem seus lançamentos, cartões e metas. Troque pela etiqueta ao lado do “Olá”.`]]}],Qt=[{title:`Olá! Este é o Flow 👋`,text:`Seu controle financeiro pessoal: simples, bonito e privado — os dados ficam só no seu aparelho. Vamos conhecer em poucos passos?`},{route:`dashboard`,sel:`.kpis`,title:`Tudo do mês em uma tela`,text:`Entradas, total de gastos, a <b>sobra</b> e o que você tem a receber. Os números se atualizam a cada lançamento.`},{route:`dashboard`,sel:`.month-switch`,title:`Cada mês é separado`,text:`O que você registra fica no mês. Só as <b>contas cadastradas</b> (fixas) e as <b>parcelas</b> aparecem sozinhas nos meses seguintes. Use as setas ‹ › do topo.`},{route:`dashboard`,sel:`.add-btn, .fab`,title:`Registre pelo “+”`,text:`Saídas, entradas, contas fixas, parcelamentos, dívidas, metas — e até <b>importar sua planilha</b>.`},{route:`dashboard`,sel:`.plan`,title:`Quando o salário cair`,text:`As faturas que vencem no mês seguinte + as contas fora do cartão, comparadas com o que vai entrar. Você vê na hora quanto do próximo salário já está comprometido.`},{route:`cartoes`,sel:`.cards-grid`,title:`Cartões e faturas`,text:`Cada cartão tem limite, <b>dia de fechamento</b> e vencimento. O Flow coloca cada compra na fatura certa.`},{route:`devedores`,sel:`.debt-grid`,title:`Devedores e “Eu devo”`,text:`Quem te deve e o que você deve — à vista ou parcelado. Emprestou o cartão? A compra entra direto na fatura e a pessoa fica te devendo.`},{route:`calendario`,sel:`.cal-board`,title:`Calendário`,text:`Cada dia do mês com o que vence: faturas, fechamentos, contas, entradas, cobranças e os seus <b>lembretes</b> (boleto, IPVA, renovação…), com aviso no dia.`},{route:`metas`,sel:`.goals`,title:`Metas e caixinhas`,text:`Guarde para seus objetivos. O que você guarda sai da sobra do mês.`},{route:`ajustes`,sel:`.set-nav`,title:`Do seu jeito`,text:`Aparência (Liquid Glass, Neon, Natal…), categorias com ícones, perfis, bloqueio com PIN, avisos, backup e a <b>sincronização por QR code</b> entre celular e computador.`},{route:`dashboard`,sel:`.help-link, .nav-me`,title:`Ficou com dúvida?`,text:`A <b>Central de ajuda</b> (no celular, toque no seu avatar, na barra de baixo) responde as perguntas mais comuns e mostra este tutorial de novo quando quiser.`},{title:`Tudo pronto! 🎉`,text:`Comece registrando seus gastos ou importe sua planilha. Bom controle!`,last:!0}],H=null;function $t(){let e=l(`#tour-name`);if(!e)return;let t=e.value.trim();t&&t!==F.user.name&&(F.user.name=t,P(),Co(0))}var en=0;function tn(){$(),dn(!1),H={i:0};let e=document.createElement(`div`);e.id=`tour`,e.innerHTML=`<div class="tour-spot none"></div><div class="tour-card hide center" role="dialog" aria-live="polite"></div>`,document.body.appendChild(e),document.documentElement.classList.add(`tour-on`),on(0)}fun     <p style="font-size:22px;font-weight:700;margin:0 0 8px">flow<b>.</b></p>
    <p>Este arquivo é só uma parte do Flow e não abre sozinho.</p>
    <p>No computador, abra o arquivo <b>Flow.html</b> (pasta <i>compartilhar</i>). No celular Android, instale o <b>Flow.apk</b>.</p>
  </div></div>
  <div class="bg-blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">
          <!-- carteira no centro + anel de "volta" (seta circular) ao redor, como Saturno -->
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g class="orbit"><g transform="rotate(-18 16 16)"><path d="M1.5 16A14.5 4.2 0 0 1 30.5 16"/></g></g>
            <rect x="10" y="9" width="12" height="10.5" rx="2.5" style="fill:var(--accent)"/>
            <path d="M10 12.2h9.5"/><path d="M22 13.4h-3a1.6 1.6 0 0 0 0 3.2h3"/>
            <g class="orbit"><g transform="rotate(-18 16 16)">
              <path d="M30.5 16A14.5 4.2 0 0 1 2 17.1" style="stroke:var(--accent)" stroke-width="4.4"/>
              <path d="M30.5 16A14.5 4.2 0 0 1 2 17.1"/><path d="M2.1 20.1 2 17.1 5 17.5"/>
            </g></g>
          </svg>
        </span>
        <span class="brand-name">flow<em>.</em></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="help-link" href="#/ajuda"></a>
        <div class="foot-row">
          <button class="icon-btn" data-act="toggle-theme" data-tip="Alternar tema" aria-label="Alternar tema"></button>
          <span class="muted small">Dados salvos neste navegador</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="greet">
          <div class="greet-row"><p class="hello" id="hello">Olá!</p><div class="greet-tools" id="greet-tools"></div></div>
          <p class="welcome">Seja bem-vindo novamente</p>
        </div>
        <div class="month-switch" id="month-switch">
          <button class="icon-btn" data-act="month-prev" aria-label="Mês anterior"></button>
          <button class="month-label" data-act="month-today" data-tip="Voltar para o mês atual"><span id="month-label"></span></button>
          <button class="icon-btn" data-act="month-next" aria-label="Próximo mês"></button>
        </div>
        <button class="btn primary add-btn" data-act="new-item"><span class="add-ic"></span><span>Novo lançamento</span></button>
      </header>

      <div id="view" class="view"></div>
    </main>
  </div>

  <button class="fab" data-act="new-item" aria-label="Novo lançamento"></button>
  <div id="modal-root" class="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <div id="tip" class="tip"></div>
  <div id="lock-root" class="lock-root" hidden></div>
  <div class="snow" aria-hidden="true"></div>

</body>
</html>
